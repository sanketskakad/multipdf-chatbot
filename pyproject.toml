[project]
name = "multipdf-chatbot"
version = "0.1.0"
description = "A RAG-based chatbot that lets you upload multiple PDFs and ask questions about their content using LLMs and vector search."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.138.0",
    "fastembed>=0.8.0",
    "flashrank>=0.2.10",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.3.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.3.3",
    "langchain-text-splitters>=1.1.2",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "rank_bm25>=0.2.2",
    "uvicorn>=0.49.0",
]
